<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Clips — XTOC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="app-identity">
        <img src="../wordmark.svg" alt="XTOC" width="112" height="27">
        <div>
          <h1>Saved Clips</h1>
        </div>
      </div>
      <p class="privacy-note">Stored in this browser. Export anytime.</p>
    </header>

    <main class="options-layout">
      <section class="settings-section excerpt-section">
        <div class="section-header">
          <div class="section-title-block">
            <h2>Your library</h2>
            <div class="compact-stats" aria-label="Saved clip stats">
              <span><strong id="articleCount">0</strong> articles</span>
              <span><strong id="excerptCount">0</strong> clips</span>
            </div>
          </div>
          <div class="excerpt-actions">
            <button class="selection-summary hidden" id="clearSelectionBtn" type="button" title="Clear selection">
              <span aria-hidden="true">×</span>
              <strong id="selectionSummary">0 selected</strong>
            </button>
            <div class="dropdown" id="exportDropdown">
              <button class="btn-compact" id="exportMenuBtn" type="button" aria-expanded="false" aria-haspopup="true">Export all</button>
              <div class="dropdown-menu" id="exportMenu" role="menu">
                <button type="button" id="exportMarkdownMenuItem" data-action="export-markdown" role="menuitem">All clips as Markdown</button>
                <button type="button" id="exportJsonMenuItem" data-action="export-json" role="menuitem">All clips as JSON</button>
              </div>
            </div>
            <button class="btn-compact danger hidden" id="deleteSelectedBtn" type="button">Delete selected</button>
          </div>
        </div>
        <div class="excerpt-search-row">
          <label class="select-all-control" for="selectAllVisible">
            <input class="clip-checkbox" id="selectAllVisible" type="checkbox">
            <span id="selectAllLabel">Select all</span>
          </label>
          <div class="excerpt-search" role="search">
            <input id="excerptSearchInput" type="search" autocomplete="off" aria-label="Search clips" placeholder="Search text, title, author, tags, or notes">
          </div>
        </div>

        <div id="excerptManager" class="excerpt-manager">
          <p class="empty-state">No saved clips yet.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Enjoying XTOC? Give it a</span>
      <a href="https://github.com/HiAriesZhou/x-toc" target="_blank" rel="noopener noreferrer" aria-label="Star XTOC on GitHub">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28-.36 6.72-1.61 6.72-7A5.4 5.4 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.4 5.4 0 0 0-1.42 2.73c0 5.42 3.44 6.66 6.72 7A4.8 4.8 0 0 0 9 18v4"/>
          <path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
        <span>Star</span>
      </a>
      <span>on GitHub ⭐</span>
    </footer>
  </div>

  <aside class="clip-editor-popover" id="clipEditorPopover" role="dialog" aria-modal="false" aria-labelledby="clipEditorHeading" aria-describedby="clipEditorTitle" aria-hidden="true">
    <div class="clip-editor-header">
      <div class="clip-editor-heading">
        <span class="editor-eyebrow" id="clipEditorHeading">Edit clip</span>
        <p id="clipEditorTitle" class="clip-editor-preview"></p>
      </div>
      <button class="icon-button" id="closeClipEditorBtn" type="button" aria-label="Close editor" title="Close editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="clipEditorForm">
      <div class="clip-editor-field clip-editor-tags-field">
        <div class="clip-editor-field-label">
          <label for="clipTagInput">Tags</label>
          <span id="clipTagHint">Enter or comma to add</span>
        </div>
        <input id="clipTagInput" class="clip-tag-input" type="text" autocomplete="off" placeholder="Type a tag" aria-describedby="clipTagHint clipEditorStatus">
        <div class="clip-editor-tags" id="clipEditorTags" aria-label="Added tags"></div>
      </div>
      <div class="clip-editor-field">
        <label for="clipNoteInput">Note</label>
        <textarea id="clipNoteInput" rows="2" placeholder="Add a short note"></textarea>
      </div>
      <p class="clip-editor-status" id="clipEditorStatus" role="status" aria-live="polite"></p>
      <div class="clip-editor-footer">
        <button class="secondary-button" id="cancelClipEditorBtn" type="button">Cancel</button>
        <button class="primary-button" type="submit">Save</button>
      </div>
    </form>
  </aside>

  <script type="module" src="scripts.js"></script>
</body>
</html>
