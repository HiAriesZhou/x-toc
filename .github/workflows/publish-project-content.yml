name: Publish portfolio project content

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify portfolio
        env:
          DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          PORTFOLIO_REPOSITORY: ${{ secrets.PORTFOLIO_REPOSITORY }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ] || [ -z "$PORTFOLIO_REPOSITORY" ]; then
            echo "Portfolio dispatch is not configured; the scheduled pull remains active."
            exit 0
          fi
          payload="$(jq -n --arg revision "$GITHUB_SHA" '{event_type:"project-content-published",client_payload:{slug:"x-toc",repository:"HiAriesZhou/x-toc",revision:$revision}}')"
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PORTFOLIO_REPOSITORY/dispatches" \
            --data "$payload"
